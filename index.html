<!DOCTYPE html>
<html lang="zh">
<head>

    <style>
        body, html {
            height: 100%;
            margin: 0;
            background-image: url('whole.png');
            background-repeat: no-repeat;
            background-attachment: fixed; 
            background-position: center; 
            background-size: cover;
            display: flex;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .fixed-text {
            position: absolute;
            top: 200px;
            left: 300px;
        }

        .popupBtn {
            position: fixed;
            bottom: 250px;
            padding: 20px 20px;
            background-color: #007bff00;
            color: white;
            border: none;
            cursor: pointer;
            margin-right: 10px;
        }
        #popup1Btn { left: 290px; }
        #popup2Btn { left: 390px; }
        #popup3Btn { left: 470px; }
        #popup4Btn { left: 580px; }
        #playBtn { left: 100px; top: 600px; }
        #volumeControl { left: 100px; top: 620px; }

        .popup {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            background-size: cover;
            background-position: center;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            width: 650px;
            height: 650px;
        }

        .photo-container {
            position: relative;
            width: 300px;
            height: 300px;
            top: 170px;
            left: 350px;
        }

        .photo-piece {
            width: 100%;
            height: 100%;
            background-image: url('me.png');
            background-size: cover;
            background-position: center;
            animation: rotate 60s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #overlay {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .absolute {
            position: absolute;
            top: 170px;
            left: 0px;
        }
        
        .relative {
            position: relative;
            border: 1px solid #00000000;
            height: 200px;
        }

        .text-button {
            background: none;
            border: none;
            color: rgb(255, 255, 255);
            font-size: 16px;
            cursor: pointer;
        }

        .link-button {
            font-weight: 300;
            font-size: 20px;
        }
    </style>
</head>

<body>

<audio id="music">

<div class="fixed-text">

<div class="wrap">

    </div>

    <script>
        const popupBtns = document.querySelectorAll('.popupBtn');
        const popups = document.querySelectorAll('.popup');
        const overlay = document.getElementById('overlay');
        const playBtn = document.getElementById('playBtn');
        const audio = document.getElementById('music');
        const volumeControl = document.getElementById('volumeControl');

        popupBtns.forEach((btn, index) => { 
            btn.addEventListener('click', (event) => {
                if (event.target.id !== 'popup3Btn') {
                if (btn.id === 'popup1Btn') {
                popups[0].style.display = 'block';
                } else if (btn.id === 'popup2Btn') {
                popups[1].style.display = 'block';
                } else if (btn.id === 'popup4Btn') {
                popups[2].style.display = 'block';
                }
                overlay.style.display = 'block';
                }});});

        overlay.addEventListener('click', () => {
        popups.forEach(popup => popup.style.display = 'none');
        overlay.style.display = 'none'; }); 

        playBtn.addEventListener('click', (event) => {
            event.stopPropagation();

            if (audio.paused) {
            audio.play();
            } else {
            audio.pause();}});

        volumeControl.addEventListener('input', (event) => {
        audio.volume = event.target.value;});

        </script>
